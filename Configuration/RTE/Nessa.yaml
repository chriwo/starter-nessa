imports:
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Processing.yaml' }
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Base.yaml' }
  - { resource: 'EXT:rte_ckeditor/Configuration/RTE/Editor/Plugins.yaml' }

processing:
  exitHTMLparser_db:
    keepNonMatchedTags: 1
    tags:
      li:
        allowedAttribs:
          - class

editor:
  config:
    contentsCss:
      - 'EXT:starter_nessa/Resources/Public/Frontend/rte.min.css'

    toolbar:
      items:
        - undo
        - redo
        - '|'
        - link
        - '|'
        - insertTable
        - '|'
        - specialCharacters
        - '|'
        - sourceEditing
        - '-'
        - bold
        - italic
        - underline
        - subscript
        - superscript
        - softhyphen
        - style
        - '|'
        - alignment:left
        - alignment:center
        - alignment:right
        - blockQuote
        - '|'
        - bulletedList
        - numberedList
        - '|'
        - removeFormat
        - findAndReplace

    style:
      definitions:
        - { name: 'List Unstyled', element: 'ul', classes: ['list-unstyled'] }

    alignment:
      options:
        - { name: 'left', className: 'text-start' }
        - { name: 'center', className: 'text-center' }
        - { name: 'right', className: 'text-end' }

    table:
      defaultHeadings: { rows: 1 }
      contentToolbar:
        - tableColumn
        - tableRow
        - mergeTableCells
        - tableProperties
        - tableCellProperties
        - toggleTableCaption
