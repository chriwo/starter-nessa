categories:
  ThemeNessa:
    label: 'Theme Nessa'
  ThemeNessa.templates.page:
    label: 'Pages templates'
    parent: ThemeNessa
  ThemeNessa.icons:
    label: 'Icons'
    parent: ThemeNessa

settings:
  starter.branch.title:
    label: 'Project or customer name'
    description: ''
    type: string
    default: 'Starter Theme Nessa'

  starter.branch.images.logo:
    label: 'Project or customer logo'
    description:
    type: string
    default: 'EXT:starter_nessa/Resources/Public/Frontend/Images/Logo.svg'

  starter.branch.images.favicon:
    label: 'Browser favicon of project or customer'
    description:
    type: string
    default: 'EXT:starter_nessa/Resources/Public/Frontend/Images/favicon.svg'

  starter.branch.images.touch-icon:
    label: 'Touch icon of project or customer'
    description:
    type: string
    default: 'EXT:starter_nessa/Resources/Public/Frontend/Images/touch-icon.svg'

  starter.branch.creator.name:
    label: 'Name person or company who created the project'
    description:
    type: string
    default: ''

  starter.branch.creator.link:
    label: 'Website link of person or company who created the project'
    description:
    type: string
    default: ''

  starter.branch.creator.linkTitle:
    label: 'Link title of person or company who created the project'
    description:
    type: string
    default: ''

  starter.fluidtemplate.layoutRootPath:
    label: 'Layout Root Path'
    category: ThemeNessa.templates.page
    type: string
    default: 'EXT:starter_nessa/Resources/Private/Frontend/Layouts/'

  starter.fluidtemplate.partialRootPath:
    label: 'Partial Root Path'
    category: ThemeNessa.templates.page
    type: string
    default: 'EXT:starter_nessa/Resources/Private/Frontend/Partials/'

  starter.fluidtemplate.templateRootPath:
    label: 'Template Root Path'
    category: ThemeNessa.templates.page
    type: string
    default: 'EXT:starter_nessa/Resources/Private/Frontend/Templates/'

  starter.tracking.google.siteVerification:
    label: 'Site verification value'
    description:
    type: string
    default: ''

  starter.header.position:
    label: 'Header position behaviour'
    description: 'How the site header behaves while scrolling. "sticky" keeps the header in the document flow and pins it to the top once reached. "fixed" detaches the header (Bootstrap fixed-top behaviour); the offset reserved for the first content element is derived from the header height in CSS. "static" keeps the header in the flow and lets it scroll away with the page (no pinning).'
    type: string
    default: 'fixed'
    enum:
      sticky: 'Sticky (scrolls with content, then pins to top)'
      fixed: 'Fixed (always visible, detached from flow)'
      static: 'Static (scrolls away with the page)'

  starter.meta.viewport:
    label: 'ViewPort Setting for Responsive Websites'
    description: ''
    type: string
    default: 'width=device-width, initial-scale=1, minimum-scale=1'

  starter.meta.google:
    label: 'Google Chrome translate option'
    description: 'Use Google Chrome translation. If this value is set to "translate," the Google Chrome browser automatically provides a translation of the page.'
    type: string
    default: 'notranslate'

  starter.pid.defaultMetaPageUid:
    label: 'UID which by default contains the metadata'
    description: ''
    type: int
    default: 1

  starter.pid.xmlSitemapRootUid:
    label: 'UID of root page for sitemap generation'
    description: ''
    type: int
    default: 1

  starter.pid.footerMenuPageUid:
    label: 'UID of sys-folder for Footer-Menu'
    description: ''
    type: int
    default: 0

  starter.icons.directories:
    label: 'Icon directories (backend selection)'
    description: 'Directories whose built *.svg icons are selectable in the backend icon dropdown of this site, in order. The first entry is the built-in theme directory; remove it to ignore the shipped icons, or add customer directories (one EXT: path per entry).'
    category: ThemeNessa.icons
    type: stringlist
    default:
      - 'EXT:starter_nessa/Resources/Public/Frontend/Icons/'

  starter.icons.spriteFiles:
    label: 'Icon sprite files (frontend)'
    description: 'SVG sprite files injected inline into the frontend body of this site, in order. The first entry is the built-in theme sprite; remove it to ignore the shipped icons, or add customer sprites (one EXT: path per entry). On symbol-id collisions the first entry in the list wins.'
    category: ThemeNessa.icons
    type: stringlist
    default:
      - 'EXT:starter_nessa/Resources/Public/Frontend/icons.svg'
