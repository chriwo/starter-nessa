<html xmlns:f="https://xsd.helhum.io/ns/typo3/cms-fluid/master/ViewHelpers"
      data-namespace-typo3-fluid="true"
>

<div class="col-sm-6 col-xl-3 d-flex align-items-stretch mt-2 aos-init aos-animate"
     data-aos="fade-up"
     data-aos-delay="100"
>
    <f:link.typolink parameter="{teaserItem.data.link}">
        <div class="teaser__body">
            <h4 class="teaser__header">{teaserItem.data.header}</h4>
            <p class="teaser__copy">{teaserItem.data.bodytext}</p>
        </div>
    </f:link.typolink>
</div>

</html>
