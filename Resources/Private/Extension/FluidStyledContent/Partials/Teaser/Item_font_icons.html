<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true"
>

<div class="col-md-6 col-lg-4 d-flex align-items-stretch mt-4"
     data-aos="zoom-in"
     data-aos-delay="100"
>
	<f:link.typolink parameter="{teaserItem.data.link}">
		<div class="teaser__wrapper">
			<div class="icon">
				<i class="{teaserItem.data.icon}"></i>
			</div>

            <div class="teaser__body">
                <h4 class="teaser__header">{teaserItem.data.header}</h4>
                <p class="teaser__copy">{teaserItem.data.bodytext}</p>
            </div>
		</div>
	</f:link.typolink>
</div>

</html>
