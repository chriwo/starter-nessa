<html xmlns:f="https://xsd.helhum.io/ns/typo3/cms-fluid/master/ViewHelpers"
      data-namespace-typo3-fluid="true"
>

<f:layout name="Default"/>

<f:section name="Header">
    <f:render partial="Headers" arguments="{data: data, settings: settings}"/>
</f:section>

<f:section name="Main">

    <div class="row content">
        <div class="col">
            <f:if condition="{data.bodytext}">
                <f:format.html>{data.bodytext}</f:format.html>
            </f:if>
        </div>
    </div>

    <div class="row">
        <f:for each="{teamMembers}" as="teamMember">
            <f:render partial="Team/Item" arguments="{teamMember: teamMember, settings: settings}"/>
        </f:for>
    </div>

</f:section>

</html>
