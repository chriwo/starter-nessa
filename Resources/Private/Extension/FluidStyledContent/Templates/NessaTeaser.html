<html xmlns:f="https://xsd.helhum.io/ns/typo3/cms-fluid/master/ViewHelpers"
      data-namespace-typo3-fluid="true"
>

<f:layout name="Teaser"/>

<f:section name="Header">
    <f:render partial="Headers" arguments="{data: data}"/>
</f:section>

<f:section name="Main">
    <f:if condition="{data.bodytext}">
        <div class="row">
            <div class="col">
                <f:format.html>{data.bodytext}</f:format.html>
            </div>
        </div>
    </f:if>

    <div class="row">
        <f:for each="{teasers}" as="teaser">
            <f:render partial="Teaser/Item_{data.nessa_teaser_type}" arguments="{teaserItem: teaser, ceData: data}"/>
        </f:for>
    </div>
</f:section>

</html>
