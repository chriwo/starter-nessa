<html xmlns:f="https://xsd.helhum.io/ns/typo3/cms-fluid/master/ViewHelpers"
			data-namespace-typo3-fluid="true">

	{iconSprite -> f:format.raw()}

	<f:render partial="Header" arguments="{_all}"/>

	<f:comment>
		# Hero region (colPos 1) — rendered above the main content. Empty on pages
		# without a hero. Under a fixed header the hero CEs reserve the header offset.
	</f:comment>
	<div class="c-site__hero">
		<f:cObject typoscriptObjectPath="lib.starterDynamicContent" data="{pageUid: '{data.uid}', colPos: '1'}" />
	</div>

	<main class="c-site__main">
		<f:comment>
			# render a breadcrumb menu
		</f:comment>
		<f:render partial="Navigation/MenuBreadcrumb" arguments="{menuBreadcrumb: menuBreadcrumb}"/>

		<f:comment>
			# render page content
		</f:comment>
		<f:render section="SiteContent"/>

	</main>

	<footer class="o-site-footer">
		<f:comment>
			# render footer content
		</f:comment>
		<f:cObject typoscriptObjectPath="lib.starterDynamicContentSlide" data="{pageUid: '{data.uid}', colPos: '2'}" />
	</footer>

	<a href="#" id="js-back-to-top" class="o-back-to-top" aria-label="Back to top">
		<svg class="icon" aria-hidden="true" focusable="false"><use href="#bi-chevron-up"></use></svg>
	</a>

</html>
