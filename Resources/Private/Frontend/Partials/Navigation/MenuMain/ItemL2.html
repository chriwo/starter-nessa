<html xmlns:f="https://xsd.helhum.io/ns/typo3/cms-fluid/master/ViewHelpers"
			data-namespace-typo3-fluid="true">

<f:comment># Desktop navigation — level 2 item. Items with children open a level-3 dropdown sideways.</f:comment>
<f:if condition="{item.children}">
	<f:then>
		<li class="c-mainnav__subitem c-mainnav__subitem--has-children" role="none" aria-haspopup="true">
			<button type="button" role="menuitem" class="c-mainnav__sublink c-mainnav__subtoggle" aria-expanded="false">
				<f:format.raw>{item.title}</f:format.raw>
				<svg class="c-mainnav__chevron c-mainnav__chevron--right icon" aria-hidden="true" focusable="false"><use href="#bi-chevron-right"></use></svg>
			</button>
			<ul class="c-mainnav__dropdown c-mainnav__dropdown--l3" role="menu">
				<f:for each="{item.children}" as="child">
					<li class="c-mainnav__subitem" role="none">
						<a href="{child.link}" target="{child.data.target}" role="menuitem" class="c-mainnav__sublink">
							<f:format.raw>{child.title}</f:format.raw>
						</a>
					</li>
				</f:for>
			</ul>
		</li>
	</f:then>
	<f:else>
		<li class="c-mainnav__subitem" role="none">
			<a href="{item.link}" target="{item.data.target}" role="menuitem" class="c-mainnav__sublink">
				<f:format.raw>{item.title}</f:format.raw>
			</a>
		</li>
	</f:else>
</f:if>

</html>
