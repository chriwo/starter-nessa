<html xmlns:f="https://xsd.helhum.io/ns/typo3/cms-fluid/master/ViewHelpers"
			data-namespace-typo3-fluid="true">

<header id="site-header" class="o-site-header is-header-{settings.header.position}">
	<div class="container">
		<div class="o-site-header__inner">

			<f:render partial="Navigation/Brand" arguments="{_all}"/>

			<f:comment># Desktop navigation (>= lg breakpoint)</f:comment>
			<f:render partial="Navigation/MenuMain" arguments="{menuMain: menuMain}"/>

			<f:comment># Hamburger toggler (< lg breakpoint) — opens the offcanvas panel</f:comment>
			<button class="o-site-header__toggler d-lg-none"
					type="button"
					data-bs-toggle="offcanvas"
					data-bs-target="#offcanvasNav"
					aria-controls="offcanvasNav"
					aria-expanded="false"
					aria-label="{f:translate(key: 'navigation.open', default: 'Open navigation')}">
				<span class="o-site-header__toggler-lines" aria-hidden="true">
					<span></span><span></span><span></span>
				</span>
			</button>

		</div>
	</div>
</header>

<f:comment># Mobile navigation (Bootstrap 5 Offcanvas)</f:comment>
<f:render partial="Navigation/Offcanvas" arguments="{_all}"/>

</html>
