name: E2E Navigation Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Resources/Private/frontendSrc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Start DDEV and initialise TYPO3
        working-directory: .
        run: |
          ddev start
          ddev initialize
          ddev build-assets

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install E2E dependencies
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Playwright + axe tests
        env:
          E2E_BASE_URL: https://theme-nessa.ddev.site
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Resources/Private/frontendSrc/playwright-report/
          retention-days: 14
