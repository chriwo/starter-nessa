name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 14.4.0 or 14.4.0-beta.1'
        required: true
        type: string

permissions:
  contents: write # push bump commit + tag, create the GitHub Release
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Resources/Private/frontendSrc
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # full history so the changelog can diff against the previous tag

      - name: Validate version input
        working-directory: .
        run: |
          VERSION='${{ inputs.version }}'
          if ! [[ "$VERSION" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Invalid version '$VERSION'. Use e.g. 14.4.0 or 14.4.0-beta.1 (no leading 'v')."
              exit 1
          fi
          # Guard against duplicate/overwritten releases: the tag must not exist yet.
          # checkout with fetch-depth: 0 fetches all tags, so a local check is authoritative.
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "::error::Tag 'v$VERSION' already exists. Choose a new version."
              exit 1
          fi
          echo "Version '$VERSION' is valid and unused."

      - name: Determine dist-tag and prerelease flag
        id: meta
        working-directory: .
        run: |
          VERSION='${{ inputs.version }}'
          if [[ "$VERSION" == *-* ]]; then
              echo "npm_tag=beta" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
              echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Bump version in package.json and package-lock.json
        run: npm version "${{ inputs.version }}" --no-git-tag-version

      - name: Install dependencies
        run: npm ci

      # Build gate: the frontend assets are no longer versioned on main, so the
      # release builds them here. Running it before any publish/push means a
      # broken build fails the run without leaving a dangling commit or tag.
      - name: Build frontend assets
        run: npm run build

      # npm publish is the second gate: it runs before any git push, so an
      # invalid NPM_TOKEN fails the run without leaving a dangling commit or tag.
      # (Only source is published — see the "files" field in package.json.)
      - name: Publish to npmjs.com
        run: npm publish --provenance --access public --tag ${{ steps.meta.outputs.npm_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump to main
        working-directory: .
        run: |
          VERSION='${{ inputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # -a only stages tracked files (package.json / package-lock.json).
          # The built assets under Resources/Public/Frontend/ are gitignored and
          # therefore stay out of this commit and off main.
          git commit -am "[TASK] Set version to $VERSION"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Generate release notes
        id: notes
        working-directory: .
        run: |
          VERSION='${{ inputs.version }}'
          # PREV is resolved by version sort, not ancestry: the tag points at the
          # off-main build commit (see the next step), so a previous release tag
          # is not an ancestor of HEAD and `git describe` would find the wrong one.
          #
          # For a stable release, diff against the previous *stable* tag so the notes
          # collect everything since the last stable — including changes already shipped
          # in intermediate betas. For a prerelease, diff against the nearest tag of any
          # kind (beta or stable) so each beta only lists its own delta.
          if [[ '${{ steps.meta.outputs.prerelease }}' == 'true' ]]; then
              PREV="$(git tag --list 'v*' --sort=-version:refname | grep -vFx "v$VERSION" | head -n1 || true)"
          else
              PREV="$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vFx "v$VERSION" | head -n1 || true)"
          fi
          if [[ -n "$PREV" ]]; then
              RANGE="$PREV..HEAD"
              COMPARE="${{ github.server_url }}/${{ github.repository }}/compare/$PREV...v$VERSION"
          else
              RANGE="HEAD"
              COMPARE=""
          fi

          features="$(git log "$RANGE" --no-merges --pretty='- %s' --grep='^\[FEATURE\]' || true)"
          bugfixes="$(git log "$RANGE" --no-merges --pretty='- %s' --grep='^\[BUGFIX\]' || true)"
          # Everything that is not a FEATURE or BUGFIX (tasks, and any un-prefixed commits)
          others="$(git log "$RANGE" --no-merges --pretty='- %s' --invert-grep --grep='^\[FEATURE\]' --grep='^\[BUGFIX\]' || true)"

          {
              echo 'body<<__RELEASE_NOTES__'
              [[ -n "$features" ]] && printf '## Features\n\n%s\n\n' "$features"
              [[ -n "$bugfixes" ]] && printf '## Bugfixes\n\n%s\n\n' "$bugfixes"
              [[ -n "$others" ]] && printf '## Tasks & Maintenance\n\n%s\n\n' "$others"
              [[ -n "$COMPARE" ]] && printf '**Full changelog:** %s\n' "$COMPARE"
              echo '__RELEASE_NOTES__'
          } >> "$GITHUB_OUTPUT"

      # The built assets are not versioned on main. They are committed here on
      # top of the version-bump commit and only that commit is tagged. Composer
      # installs use the tag's git archive, so the extension ships with its
      # frontend assets, while main stays free of generated files.
      - name: Commit built assets and tag
        working-directory: .
        run: |
          VERSION='${{ inputs.version }}'
          git add -f Resources/Public/Frontend
          git commit -m "[TASK] Build frontend assets for v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION" # tag only — this commit is not pushed to main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: ${{ steps.notes.outputs.body }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
